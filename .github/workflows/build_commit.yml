name: Build Commit

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      build-type:
        required: true
        type: string
      malloc-impl:
        required: true
        type: string
      compiler:
        required: false
        type: string
        default: 'gcc'
      conan-channel:
        required: false
        type: string
        default: 'dev'
      tooling:
        required: true
        type: string

jobs:
  # craft_client's only real dependency is sisl (result / async::result / when_quorum + sg_list). Build it
  # into the conan cache first; PR builds skip this job and load the cache the push build stored.
  SislDeps:
    uses: szmyd/sisl/.github/workflows/build_dependencies.yml@dev/v14.x
    with:
      branch: dev/v14.x
      platform: ${{ inputs.platform }}
      build-type: ${{ inputs.build-type }}
      malloc-impl: ${{ inputs.malloc-impl }}
      compiler: ${{ inputs.compiler }}
      conan-channel: ${{ inputs.conan-channel }}
      tooling: None
    if: ${{ github.event_name != 'pull_request' }}

  CraftClientDeps:
    needs: SislDeps
    if: ${{ always() && (needs.SislDeps.result == 'success' || needs.SislDeps.result == 'skipped') }}
    uses: ./.github/workflows/build_dependencies.yml
    with:
      branch: ${{ github.ref }}
      platform: ${{ inputs.platform }}
      build-type: ${{ inputs.build-type }}
      malloc-impl: ${{ inputs.malloc-impl }}
      compiler: ${{ inputs.compiler }}
      conan-channel: ${{ inputs.conan-channel }}
      tooling: ${{ inputs.tooling }}
      testing: 'True'
